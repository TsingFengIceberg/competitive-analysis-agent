[project]
name = "ci-agent"
version = "0.1.0"
description = "Competitive-Analysis-Agent — standalone multi-agent competition analysis"
requires-python = ">=3.12"
dependencies = [
    "competition",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
markers = [
    "live: test that requires a real LLM connection (API key needed, skipped by default)",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.workspace]
members = ["packages/competition"]

[tool.uv.sources]
competition = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
