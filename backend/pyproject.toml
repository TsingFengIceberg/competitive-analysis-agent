[project]
name = "ci-agent"
version = "0.1.0"
description = "Competitive-Analysis-Agent — standalone multi-agent competition analysis"
requires-python = ">=3.12"
dependencies = [
    "competition",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.27",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "tavily-python",
    "ddgs",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
    "python-jose>=3.5.0",
    "sqlalchemy[asyncio]>=2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "live: test that requires a real LLM connection (API key needed, skipped by default)",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.workspace]
members = ["packages/competition"]

[tool.uv.sources]
competition = { workspace = true }
