[project]
name = "competition"
version = "0.1.0"
description = "Competitive Analysis Agent LangGraph workflow"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.15",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.9",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "tavily-python>=0.7.17",
    "ddgs>=9.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["competition"]
