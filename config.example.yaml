# Competitive-Analysis-Agent Configuration
#
# Copy this file to `config.yaml` and customize it for your environment.
# Only the `competition` section is required; everything else has defaults.

config_version: 9

# ============================================================================
# Competition Module — Multi-Agent Competitive Analysis
# ============================================================================
# All fields and sub-sections have sensible defaults; only override what you need.

competition:

  # Default LLM model for all agents
  default_model: "doubao-seed-2-0-lite-260215"

  # Default report persona: "pm" / "entrepreneur" / "both"
  default_persona: "both"

  # Max retries for schema validation failures
  schema_validation_retries: 2

  # ── Orchestrator Agent ─────────────────────────────────────────────────
  orchestrator:
    model: "doubao-seed-2-0-lite-260215"
    timeout_seconds: 60
    max_turns: 1
    temperature: 0.0
    max_tokens: 800
    tools: []
    skills: []

  # ── Collector Agent ────────────────────────────────────────────────────
  collector:
    model: "doubao-seed-2-0-lite-260215"
    max_turns: 30
    timeout_seconds: 600
    tools:
      - web_search
      - web_fetch
      - python
      - write_file
      - read_file

  # ── Analyst Agent ──────────────────────────────────────────────────────
  analyst:
    model: "doubao-seed-2-0-lite-260215"
    max_turns: 20
    timeout_seconds: 300
    tools:
      - web_search
      - web_fetch
      - python
      - write_file
      - read_file

  # ── Reviewer Agent ─────────────────────────────────────────────────────
  reviewer:
    model: "doubao-seed-2-0-lite-260215"
    max_turns: 15
    timeout_seconds: 300
    max_feedback_rounds: 2
    tools:
      - web_search
      - web_fetch
      - python
      - write_file
      - read_file

  # ── Writer Agent ───────────────────────────────────────────────────────
  writer:
    model: "doubao-seed-2-0-lite-260215"
    max_turns: 20
    timeout_seconds: 180
    executive_summary_max_chars: 500
    default_persona: "pm"
    tools:
      - web_search
      - web_fetch
      - python
      - write_file
      - read_file

  # ── HITL Gate ──────────────────────────────────────────────────────────
  hitl:
    approval_timeout_minutes: 30
    enable_feishu_approval: false
    enable_frontend_approval: true
