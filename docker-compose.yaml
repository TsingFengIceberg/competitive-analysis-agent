# CI-Agent — Production Docker Compose
# Usage: docker compose up -d
# Access: http://localhost:2026/competition

services:
  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ci-agent-nginx
    ports:
      - "2026:2026"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - gateway
    networks:
      - ci-agent
    restart: unless-stopped

  # ── Frontend (Next.js production) ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    container_name: ci-agent-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - ci-agent
    restart: unless-stopped

  # ── Backend Gateway ──────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ci-agent-gateway
    command: >
      sh -c "cd backend
      && PYTHONPATH=packages/competition
      uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8001"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    networks:
      - ci-agent
    restart: unless-stopped

networks:
  ci-agent:
    driver: bridge
