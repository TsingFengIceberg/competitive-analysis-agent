events {
    worker_connections 1024;
}
pid /tmp/nginx-dev.pid;
http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    access_log /tmp/nginx-dev-access.log;
    error_log /tmp/nginx-dev-error.log;

    # Dev upstream servers (隔离端口，不与生产 8001/3000/2026 冲突)
    upstream gateway_dev {
        server 127.0.0.1:8002;
    }

    upstream frontend_dev {
        server 127.0.0.1:3001;
    }

    server {
        listen 2027;
        listen [::]:2027;
        server_name _;

        # SSE streaming — no buffering
        location /api/ {
            proxy_pass http://gateway_dev;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_pass_header Set-Cookie;

            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;

            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        location /health {
            proxy_pass http://gateway_dev;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            proxy_pass http://frontend_dev;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
